<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roach Motel 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a16'/%3E%3Cellipse cx='16' cy='18' rx='10' ry='7' fill='%2339ff8f'/%3E%3Ccircle cx='11' cy='14' r='2' fill='%230a0a16'/%3E%3Ccircle cx='21' cy='14' r='2' fill='%230a0a16'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-root">
    <canvas id="scene"></canvas>

    <div id="hud">
      <div id="hud-top">
        <div class="hud-box">SCORE<br><span id="score">0</span></div>
        <div class="hud-box">WAVE<br><span id="wave">1</span></div>
        <div class="hud-box">HIGH<br><span id="highscore">0</span></div>
        <div class="hud-box">LIVES<br><span id="lives">▲▲▲</span></div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>ROACH MOTEL 3D</h1>
      <p class="tagline">They check in. You check out&hellip; their score.</p>
      <p class="hint">Move: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> / <kbd>A</kbd> <kbd>D</kbd> &nbsp;&mdash;&nbsp; Fire: <kbd>Space</kbd></p>
      <button id="start-btn" class="arcade-btn">INSERT COIN</button>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p id="final-score-line"></p>
      <p id="new-high" class="hidden">NEW HIGH SCORE!</p>
      <button id="restart-btn" class="arcade-btn">PLAY AGAIN</button>
    </div>

    <div id="touch-controls">
      <button id="touch-left" class="touch-btn" aria-label="Move left">&larr;</button>
      <button id="touch-fire" class="touch-btn touch-fire" aria-label="Fire">FIRE</button>
      <button id="touch-right" class="touch-btn" aria-label="Move right">&rarr;</button>
    </div>
  </div>

  <!-- Pinned to a pre-r150 build deliberately: cdnjs uses semver paths, not
       "rNNN" (r158 doesn't resolve — caught in the load-time self-check),
       and r150+ prints a load-time deprecation warning for this classic
       <script>-tag build. We need that build anyway — it's the only one
       that works with a plain <script> tag opened via file://, which this
       repo's "no build step, opens index.html directly" rule requires. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.140.0/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
